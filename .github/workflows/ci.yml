name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts tutorials
      - name: Unit tests
        run: pytest -m "not slow"
      - name: End-to-end tests (synthetic data, small models)
        run: pytest -m slow
      - name: Bundled models load and predict
        run: |
          if ls models/*/meta.json >/dev/null 2>&1; then
            cardiotwin predict --demo demo01
          fi
