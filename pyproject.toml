[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiotwin"
version = "0.1.0"
description = "CardioTwin: estimate what an echocardiogram would show from a 10-second ECG (research software)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ishaan Mandala" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "wfdb>=4.1",
    "torch>=2.1",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.25", "ruff>=0.4"]
browser = ["playwright>=1.40"]

[project.scripts]
cardiotwin = "cardiotwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cardiotwin = ["app/static/*", "app/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
markers = ["slow: end-to-end tests that train small models (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501", "B008", "B905"]
